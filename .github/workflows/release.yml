name: Release

# Manual only. Nothing runs when a tag is pushed.
#
# 1. Bump the version, commit, tag, push the tag.
# 2. Create the release for that tag in the GitHub UI.
# 3. Actions -> Release -> Run workflow, and type the tag.
#    Turn dry_run on to build and test without touching the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (must already exist)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only; do not touch the release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version v${version}"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        run: npx electron-builder --linux AppImage --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish
    needs: linux
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release exists and matches the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No release exists for ${TAG}. Create it in the GitHub UI, then run this again."
            exit 1
          fi

          is_pre="$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)"
          case "$TAG" in
            *-*) want=true ;;
            *)   want=false ;;
          esac
          if [ "$is_pre" != "$want" ]; then
            echo "::error::Release ${TAG} has isPrerelease=${is_pre}, expected ${want}. Tick or untick 'Set as a pre-release' on the release."
            exit 1
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" artifacts/* --clobber
