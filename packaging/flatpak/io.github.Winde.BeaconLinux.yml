# Flatpak manifest — starting point, NOT yet built or tested.
#
# Missing before this can build:
#   1. flatpak-sources.json, generated with flatpak-node-generator (see docs/releasing.md)
#   2. the Electron binary vendored as a source, or provided by the base app
#
# The git source must point at a real release tag; bump `tag:` each release.

app-id: io.github.Winde.BeaconLinux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22

build-options:
  append-path: /usr/lib/sdk/node22/bin

command: startbeacon
separate-locales: false

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  # GPU access for hardware video decoding
  - --device=all
  # Controllers are not registered without this
  - --filesystem=/run/udev:ro
  # Electron's safeStorage needs the desktop keyring to keep the session; a
  # sandboxed app cannot see it otherwise, so every launch would ask for the
  # password. KWallet is not behind the Secret Service name.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Let Chromium inhibit the screensaver while playing
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  # Chromium creates a randomised MPRIS name
  - --own-name=org.mpris.MediaPlayer2.chromium.*

modules:
  - name: beacon
    buildsystem: simple
    subdir: main
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/beacon/flatpak-node/cache
        npm_config_cache: /run/build/beacon/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm install --offline
      - ../flatpak-node/electron-builder-arch-args.sh
      - npm run build
      - npx electron-builder --linux dir --publish never --config.directories.output=dist $ELECTRON_BUILDER_ARCH_ARGS
      - cp -a dist/linux*unpacked /app/bin/beacon
      - install -Dm755 ../startbeacon /app/bin/startbeacon
      - install -Dm644 io.github.Winde.BeaconLinux.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 io.github.Winde.BeaconLinux.desktop -t /app/share/applications/
      - install -Dm644 io.github.Winde.BeaconLinux.svg /app/share/icons/hicolor/scalable/apps/io.github.Winde.BeaconLinux.svg
    sources:
      - flatpak-sources.json
      - type: git
        url: https://github.com/Winde/beacon-linux.git
        tag: v0.1.0
        dest: main
      - type: file
        path: startbeacon
      - type: file
        path: io.github.Winde.BeaconLinux.svg
