appId: tv.beacon.linux
productName: Beacon
copyright: Unofficial client. Not affiliated with Critical Role.
# The release artifact name; arch is x86_64 for the AppImage.
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# Ship the license texts next to the app, not just in the repository.
extraFiles:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: licenses
    to: licenses

asar: true

linux:
  target:
    - AppImage
  category: AudioVideo
  executableName: beacon
  # The installed .desktop filename, StartupWMClass and Electron's app_id all
  # come from desktopName in package.json, so window association works.
  syncDesktopName: true
  synopsis: Unofficial Beacon (Critical Role) client
  desktop:
    entry:
      Name: Beacon
      Comment: Unofficial Critical Role streaming client, made for a controller
      Categories: AudioVideo;Video;
      Keywords: critical-role;streaming;tv;
