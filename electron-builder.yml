appId: tv.beacon.linux
productName: Beacon
copyright: Unofficial client. Not affiliated with Critical Role.

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

# Ship the license texts next to the app, not just in the repository.
extraFiles:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: licenses
    to: licenses

asar: true

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  executableName: beacon
  synopsis: Unofficial Beacon (Critical Role) client
  desktop:
    entry:
      Name: Beacon
      Comment: Unofficial Critical Role streaming client, made for a controller
      Categories: AudioVideo;Video;
      Keywords: critical-role;streaming;tv;

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
